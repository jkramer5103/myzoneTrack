[project]
name = "myzone-track"
version = "0.1.0"
description = "Unofficial Python client for the Myzone Moves dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "myzone-api @ git+https://github.com/jkramer5103/myzoneAPI.git@43a4753e272137ce37ce108a65ce5fed976ad267",
    "python-dotenv>=1.1.1",
]

[tool.uv]
package = false

[tool.setuptools]
py-modules = ["myzone"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "test_myzone.py"]
